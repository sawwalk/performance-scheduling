[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-scheduling"
version = "0.1.0"
description = "Check and find running orders for a dance show so performers get enough rest between performances."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []          # the core uses only the Python standard library

[project.optional-dependencies]
# OR-Tools is the search engine behind the schedule finder (D29). The version range is D41:
# the order of the finder's list can change between versions (D32).
finder = ["ortools>=9.15,<10"]
dev = ["pytest>=8", "ruff", "ipykernel", "jupyter", "pandas", "nbstripout", "ortools>=9.15,<10", "streamlit>=1.66,<2"]
# The page for organisers. It runs the finder, so it needs the finder group too.
# 1.66 is the version the page and its tests were built and checked with.
ui = ["streamlit>=1.66,<2", "pandas", "ortools>=9.15,<10"]

# Command-line entry points. The finder needs the "finder" extra (OR-Tools) to run.
[project.scripts]
schedule-checker = "performance_scheduling.cli:checker_main"
schedule-finder = "performance_scheduling.cli:finder_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ holds developer tools (not part of the installed package) that some tests import.
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
