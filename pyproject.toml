[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-scheduling"
version = "0.1.0"
description = "Check and find running orders for a dance show so performers get enough rest between performances."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # the core uses only the Python standard library

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "ipykernel", "jupyter", "pandas", "nbstripout", "ortools"]
finder = ["ortools"]                 # the search engine (decision D29); the schedule checker does not need it
ui = ["streamlit", "pandas"]         # later, for the simple interface

# Command-line entry points. The finder is switched on when it exists (Phase 3).
[project.scripts]
schedule-checker = "performance_scheduling.cli:checker_main"
# schedule-finder = "performance_scheduling.cli:finder_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
